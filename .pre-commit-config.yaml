repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: no-private-files
        name: Block personal data files outside demo/
        entry: scripts/check-no-private-files.sh
        language: script
        pass_filenames: false
