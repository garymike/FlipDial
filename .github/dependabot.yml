version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown: # wait a few days after a release before proposing it (security updates are not delayed)
      default-days: 3
      semver-major-days: 7
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown: # wait a few days after a release before proposing it (security updates are not delayed)
      default-days: 3
      semver-major-days: 7
    groups:
      web:
        patterns: ["*"]
    ignore:
      # TypeScript 7 is installed as @typescript/native. svelte-check still needs
      # TypeScript 6 under the plain "typescript" name, so do not bump it to 7.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown: # wait a few days after a release before proposing it (security updates are not delayed)
      default-days: 3
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown: # wait a few days after a release before proposing it (security updates are not delayed)
      default-days: 3
