name: Release

# Start a release either way:
#   - Actions > Release > Run workflow, and type the version (for example 0.9.0-rc1). The tag is
#     created for you on the latest commit of main.
#   - or push a tag like v1.0.0.
# The notes come from that version's section of CHANGELOG.md, followed by how to verify the
# signatures. By default the release stays a draft to check before publishing; tick "publish"
# when running it by hand to publish it straight away. A pushed tag always makes a draft.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, matching backend/pyproject.toml (for example 0.9.0-rc1 or 1.0.0)"
        required: true
        type: string
      publish:
        description: "Publish the release now (otherwise it is left as a draft to check first)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/flipdial

jobs:
  tag:
    name: Check version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Version matches the code
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT: ${{ inputs.version }}
          PUSHED_TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$REF" = "refs/heads/main" ] || { echo "Run this from the main branch."; exit 1; }
            tag="v${INPUT#v}"
          else
            tag="$PUSHED_TAG"
          fi
          echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|a|b)\.?[0-9]+)?$' \
            || { echo "Not a valid version: $tag"; exit 1; }
          want=$(python3 -c "import tomllib;print(tomllib.load(open('backend/pyproject.toml','rb'))['project']['version'])")
          got=$(echo "$tag" | sed -E 's/^v//; s/[-.]?(rc|a|b)\.?([0-9]+)$/\1\2/')
          [ "$want" = "$got" ] || { echo "$tag does not match version $want in backend/pyproject.toml"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Not released already
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases" --paginate -q '.[].tag_name' | grep -qx "$TAG"; then
            echo "There is already a release for $TAG. Pick a new version."; exit 1
          fi

  checks:
    name: Checks
    needs: tag
    uses: ./.github/workflows/ci.yml

  make-tag:
    # Only after the checks pass, so a failed run can simply be run again with the same
    # version. A tag left by an earlier failed run (no release yet) is moved here.
    name: Create the tag
    needs: [tag, checks]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" -f "sha=$GITHUB_SHA" -F force=true
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA"
          fi

  image:
    name: Container image
    needs: [tag, checks, make-tag]
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.make-tag.result == 'success' || needs.make-tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
      id-token: write # keyless signing (Sigstore) and attestations
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.tag }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: SBOM for the image
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: flipdial-image.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image and attach its SBOM
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate flipdial-image.spdx.json "$REF"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: Draft release
    needs: [tag, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build Python package and web app
        env:
          VERSION: ${{ needs.tag.outputs.tag }}
        run: |
          mkdir dist
          (cd backend && uv build --out-dir ../dist)
          (cd web && npm ci --no-audit --no-fund && npm run build)
          tar -C web -czf "dist/flipdial-web-${VERSION}.tar.gz" dist
          rm -f dist/.gitignore  # the Python build writes one; it is not a release file
      - name: SBOM for the source
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: spdx-json
          output-file: dist/flipdial-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Release notes
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          DIGEST: ${{ needs.image.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          version="${TAG#v}"
          # This version's section of CHANGELOG.md, without its heading.
          awk -v head="## $version" '$0 == head {found=1; next} /^## / {if (found) exit} found' \
            CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See CHANGELOG.md for what changed." > notes.md
          fi
          {
            echo
            echo "### Verify this release"
            echo
            echo "Container image: \`$IMAGE@$DIGEST\`"
            echo
            echo '```sh'
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-identity-regexp '^https://github.com/$REPO/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo
            echo "cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity-regexp '^https://github.com/$REPO/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "sha256sum --check SHA256SUMS"
            echo '```'
          } >> notes.md
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          # A draft unless "publish" was ticked when it was run by hand.
          draft: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish) }}
          prerelease: ${{ contains(needs.tag.outputs.tag, '-') }}
          generate_release_notes: true
          files: dist/*
          body_path: notes.md
