name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  schedule:
    - cron: "17 9 * * 1"  # weekly, to catch new advisories in unchanged dependencies

permissions:
  contents: read

jobs:
  privacy:
    name: Privacy and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Block personal data files outside demo/
        run: scripts/check-no-private-files.sh
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build

  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Python packages
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: npm packages
        working-directory: web
        run: npm audit --audit-level=high

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: flipdial:ci
      - name: Starts and answers health checks
        run: |
          docker run -d --name fd -p 127.0.0.1:8080:8080 -e FLIPDIAL_ALLOW_NO_AUTH=true flipdial:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs fd; exit 1
      - name: Contacts server image builds and starts with a fresh setup
        run: |
          docker build -f docker/contacts-server/Dockerfile -t flipdial-contacts:ci .
          mkdir -p cs && chmod 777 cs
          docker run --rm -v "$PWD/cs:/data" -e FLIPDIAL_ALLOW_NO_AUTH=true flipdial:ci \
            flipdial contacts-server init --host nas.example > /dev/null
          docker run -d --name cs -p 127.0.0.1:5232:5232 -v "$PWD/cs/contacts-server:/data/contacts-server" flipdial-contacts:ci
          # The setup folder is private to the container's user (0700), so copy the CA out.
          sudo cp cs/contacts-server/ca.pem ca.pem && sudo chmod 644 ca.pem
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --cacert ca.pem https://localhost:5232/ || true)
            [ "$code" = "401" ] || [ "$code" = "200" ] || [ "$code" = "302" ] && exit 0
            sleep 1
          done
          docker logs cs; exit 1

  windows:
    name: Windows scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Scripts parse in Windows PowerShell 5.1
        shell: powershell
        run: |
          Get-ChildItem scripts\windows\*.ps1 | ForEach-Object {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs; exit 1 }
          }
      - name: Updater outlives FlipDial
        # Update now starts the updater from inside FlipDial, which then stops FlipDial. This
        # copies that: a program started from Python under uv, then uv's tree is killed.
        shell: powershell
        run: |
          . scripts\windows\common.ps1
          $t = $env:RUNNER_TEMP
          foreach ($way in 'outside', 'start-process') {
            $marker = "$t\$way.txt"
            Set-Content "$t\probe-$way.ps1" "Start-Sleep 10; Set-Content '$marker' ok"
            $cmd = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File $t\probe-$way.ps1"
            if ($way -eq 'outside') {
              $body = ". '$pwd\scripts\windows\common.ps1'; Start-Outside '$cmd' | Out-Null"
            } else {
              $body = "Start-Process powershell.exe -WindowStyle Hidden -ArgumentList '-NoProfile','-File','$t\probe-$way.ps1'"
            }
            Set-Content "$t\launch-$way.ps1" $body
            $py = "import subprocess, time; subprocess.Popen(['powershell.exe','-NoProfile','-ExecutionPolicy','Bypass','-File',r'$t\launch-$way.ps1']); time.sleep(60)"
            Set-Content "$t\run-$way.py" $py
            $p = Start-Process uv -ArgumentList @('run', '--no-project', 'python', "$t\run-$way.py") -PassThru -WindowStyle Hidden
            Start-Sleep 6
            & taskkill.exe /PID $p.Id /T /F 2>$null | Out-Null
            Start-Sleep 10
            "${way}: $(if (Test-Path $marker) { 'kept running' } else { 'was stopped' })"
          }
          if (-not (Test-Path "$t\outside.txt")) { 'the updater was stopped along with FlipDial'; exit 1 }
          exit 0
      - name: Contacts server stops with FlipDial
        shell: powershell
        run: |
          Push-Location backend; uv sync --extra dev
          uv run pytest -q tests/test_builtin_server.py
          if ($LASTEXITCODE) { exit 1 }
          Pop-Location
      - name: Start, check, stop
        shell: powershell
        run: |
          "FLIPDIAL_DATA_DIR=$env:RUNNER_TEMP\flipdial-data`nFLIPDIAL_WEB_DIR=$pwd\web\dist" | Set-Content backend\.env
          Push-Location backend; uv sync; Pop-Location
          scripts\windows\start.ps1 -NoBrowser
          if ($LASTEXITCODE) { exit 1 }
          (Invoke-WebRequest http://127.0.0.1:8080/healthz -UseBasicParsing).Content
          (Invoke-WebRequest http://127.0.0.1:8080/ -UseBasicParsing).Content | Select-String FlipDial
          scripts\windows\start.ps1 -NoBrowser   # second start just reports it's running
          Start-Sleep 5   # a worker that crashes on startup would be gone by now
          . scripts\windows\common.ps1
          $roles = @(Get-FlipDialProcesses | ForEach-Object { $_.Role }) -join ','
          if ($roles -ne 'server,worker') { "expected server and worker running, found: $roles"; exit 1 }
          scripts\windows\stop.ps1
          if ($LASTEXITCODE) { 'stop failed'; exit 1 }
          Start-Sleep 2
          try { Invoke-WebRequest http://127.0.0.1:8080/healthz -UseBasicParsing -TimeoutSec 3; throw 'still running' } catch { if ($_.Exception.Message -eq 'still running') { exit 1 } }
          if (Get-Process python -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "*flipdial*" }) { 'python left running'; exit 1 }
          'start and stop work'
          exit 0
