# Example only. Copy and adjust; keep real values in .env, never in this file.
services:
  flipdial:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Without sign-in, FlipDial refuses to listen on all addresses unless told the port
      # is local only. Remove this once FLIPDIAL_AUTH_MODE is oidc or proxy.
      FLIPDIAL_ALLOW_NO_AUTH: "true"
    ports:
      - "127.0.0.1:8080:8080"   # localhost only, unless sign-in is set up
      # Uncomment if you turn on the built-in contacts server (Setup > Contacts server), so
      # phones on your home network can reach it. Never forward this port on your router.
      # - "5232:5232"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Optional, for running the contacts server separately (docs/contacts-server.md). Most
  # people use the built-in one instead: Setup > Contacts server, one button.
  # Set it up once:  docker compose run --rm flipdial flipdial contacts-server init --host <this computer's name or address>
  # Then start it:   docker compose --profile contacts-server up -d
  contacts:
    profiles: ["contacts-server"]
    build:
      context: ..
      dockerfile: docker/contacts-server/Dockerfile
    restart: unless-stopped
    ports:
      - "5232:5232"   # for phones on your home network. Never forward this port on your router.
    volumes:
      - ./data/contacts-server:/data/contacts-server
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
