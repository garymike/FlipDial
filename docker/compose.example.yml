# Example only. Copy and adjust; keep real values in .env, never in this file.
services:
  flipdial:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Without sign-in, FlipDial refuses to listen on all addresses unless told the port
      # is local only. Remove this once FLIPDIAL_AUTH_MODE is oidc or proxy.
      FLIPDIAL_ALLOW_NO_AUTH: "true"
    ports:
      - "127.0.0.1:8080:8080"   # localhost only, unless sign-in is set up
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
