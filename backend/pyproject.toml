[project]
name = "flipdial"
version = "0.13.0"
description = "Self-hosted, visual contact manager for the business cards you collect"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "pillow>=11",
    "numpy>=2.1",
    "opencv-python-headless>=4.10",
    "pypdfium2>=4.30",
    "httpx>=0.28",
    "defusedxml>=0.7",
    "pyjwt[crypto]>=2.15",
    "packaging>=26",
    "segno>=1.6",
    "radicale[bcrypt]>=3.5",
    "bcrypt>=4.2",
]

[project.optional-dependencies]
heif = ["pillow-heif>=0.20"]
# Kept so older Windows scripts that ask for it keep working; Radicale is now included.
contacts-server = []
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "radicale[bcrypt]>=3.5",
]

[project.scripts]
flipdial = "flipdial.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flipdial"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
